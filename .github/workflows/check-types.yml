name: Check types
on:
  workflow_call:
env:
  NODE_OPTIONS: --max-old-space-size=5120
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_CACHE: ${{ secrets.TURBO_TOKEN != '' && secrets.TURBO_TEAM != '' && 'local:rw,remote:rw' || 'local:rw' }}
permissions:
  contents: read
jobs:
  check-types:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/yarn-install
      - name: Show info
        run: node -e "console.log(require('v8').getHeapStatistics())"
      - name: Configure TSC problem matcher
        run: |
          echo "::remove-matcher owner=tsc::"
          echo "::add-matcher::.github/matchers/tsc-absolute.json"
      - run: yarn type-check:ci --force --concurrency=1
