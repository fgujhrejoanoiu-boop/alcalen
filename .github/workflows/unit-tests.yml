name: Unit
on:
  workflow_call:
env:
  NODE_OPTIONS: --max-old-space-size=3072
  LINGO_DOT_DEV_API_KEY: ${{ secrets.CI_LINGO_DOT_DEV_API_KEY }}
permissions:
  contents: read
jobs:
  test:
    name: Unit
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/yarn-install
      - run: yarn prisma generate
      - run: yarn test --maxWorkers=2 --passWithNoTests=false
      # We could add different timezones here that we need to run our tests in
      - run: TZ=America/Los_Angeles VITEST_MODE=timezone yarn vitest run --maxWorkers=2 --passWithNoTests=false
