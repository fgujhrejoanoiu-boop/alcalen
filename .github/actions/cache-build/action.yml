name: Cache production build binaries
description: "Cache or restore if necessary"
runs:
  using: "composite"
  steps:
    - name: Generate cache key
      id: cache-key
      uses: ./.github/actions/cache-build-key
      with:
        branch_key: ${{ github.head_ref || github.ref_name }}
    - name: Cache production build
      uses: actions/cache@v4
      id: cache-build
      with:
        path: |
          ${{ github.workspace }}/apps/web/.next
          ${{ github.workspace }}/apps/web/public/embed
          **/.turbo/**
          **/dist/**
        key: ${{ steps.cache-key.outputs.key }}
    - name: Build Web App
      run: |
        export NODE_OPTIONS="${NODE_OPTIONS:---max-old-space-size=5120}"
        export NEXT_PUBLIC_WEBAPP_URL="${NEXT_PUBLIC_WEBAPP_URL:-http://localhost:3000}"
        export NEXTAUTH_SECRET="${NEXTAUTH_SECRET:-$(openssl rand -base64 32)}"
        export CALENDSO_ENCRYPTION_KEY="${CALENDSO_ENCRYPTION_KEY:-$(openssl rand -base64 24)}"
        # Stripe's constructor requires a nonempty key even when no payment requests are made.
        export STRIPE_PRIVATE_KEY="${STRIPE_PRIVATE_KEY:-sk_test_ci_placeholder}"
        yarn build --concurrency=2
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: bash
